
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizutmaningen</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  padding: 20px;
}
.game {
  width: 100%;
  max-width: 600px;
  background: #1e293b;
  padding: 32px;
  border-radius: 18px;
}
h1 { text-align: center; }
.meta {
  display: flex;
  justify-content: space-between;
  color: #94a3b8;
  margin: 25px 0;
}
#question {
  font-size: 24px;
  line-height: 1.4;
}
.answers {
  display: grid;
  gap: 12px;
  margin: 25px 0;
}
button, select {
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
button { cursor: pointer; }
button:disabled { cursor: default; }
.answer {
  background: #334155;
  color: white;
  text-align: left;
}
.answer:hover:not(:disabled) { background: #475569; }
.answer.correct { background: #15803d; }
.answer.wrong { background: #b91c1c; }
#next, #start {
  background: #38bdf8;
  color: #082f49;
  font-weight: bold;
  width: 100%;
}
#next { display: none; }
select { width: 100%; margin: 12px 0; }
#status { color: #cbd5e1; text-align: center; }
</style>
</head>
<body>
<main class="game">
  <h1>🧠 Quizutmaningen</h1>

  <div id="setup">
    <p>Välj svårighetsgrad:</p>
    <select id="difficulty">
      <option value="">Alla svårighetsgrader</option>
      <option value="easy">Lätt</option>
      <option value="medium">Medel</option>
      <option value="hard">Svår</option>
    </select>
    <button id="start">Starta quiz</button>
  </div>

  <div id="quiz" hidden>
    <div class="meta">
      <span id="progress"></span>
      <span id="score"></span>
    </div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <button id="next">Nästa fråga →</button>
  </div>

  <p id="status" role="status"></p>
</main>

<script>
const setup = document.getElementById("setup");
const quiz = document.getElementById("quiz");
const status = document.getElementById("status");
const next = document.getElementById("next");
const start = document.getElementById("start");
const answers = document.getElementById("answers");
const questionElement = document.getElementById("question");

let questions = [];
let current = 0;
let points = 0;
let quizVersion = 0;

const translationCache = new Map();

function decode(text) {
  const el = document.createElement("textarea");
  el.innerHTML = text;
  return el.value;
}

async function translate(text) {
  const original = decode(text);

  if (translationCache.has(original)) {
    return translationCache.get(original);
  }

  const params = new URLSearchParams({
    q: original,
    langpair: "en|sv"
  });

  const response = await fetch(
    "https://api.mymemory.translated.net/get?" + params
  );

  if (!response.ok) {
    throw new Error("Översättningstjänsten svarar inte.");
  }

  const data = await response.json();

  if (Number(data.responseStatus) !== 200 ||
      !data.responseData?.translatedText) {
    throw new Error("Översättningen misslyckades.");
  }

  const result = decode(data.responseData.translatedText);
  translationCache.set(original, result);
  return result;
}

function shuffle(items) {
  const result = [...items];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

start.onclick = async () => {
  const difficulty = document.getElementById("difficulty").value;

  const url =
    "https://opentdb.com/api.php?amount=10&type=multiple" +
    (difficulty ? "&difficulty=" + difficulty : "");

  start.disabled = true;
  status.textContent = "Laddar frågor...";

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Kunde inte hämta frågor.");
    }

    const data = await response.json();

    if (data.response_code !== 0 || !data.results?.length) {
      throw new Error(
        "Inga frågor tillgängliga. Försök igen om en stund."
      );
    }

    questions = data.results;
    current = 0;
    points = 0;
    quizVersion++;

    setup.hidden = true;
    quiz.hidden = false;
    status.textContent = "";

    await showQuestion();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    start.disabled = false;
  }
};

async function showQuestion() {
  const version = quizVersion;
  const questionIndex = current;
  const q = questions[current];

  document.getElementById("progress").textContent =
    `Fråga ${current + 1} av ${questions.length}`;

  document.getElementById("score").textContent =
    `Poäng: ${points}`;

  questionElement.textContent = "Översätter fråga...";
  answers.replaceChildren();
  next.style.display = "none";
  status.textContent = "";

  const choices = [
    ...q.incorrect_answers,
    q.correct_answer
  ];

  let translatedQuestion;
  let translatedAnswers;

  try {
    const translated = await Promise.all([
      translate(q.question),
      ...choices.map(choice => translate(choice))
    ]);

    translatedQuestion = translated[0];
    translatedAnswers = translated.slice(1);
  } catch (error) {
    if (version !== quizVersion || questionIndex !== current) return;

    // Use English questions if the free translation API is unavailable.
    translatedQuestion = decode(q.question);
    translatedAnswers = choices.map(decode);

    status.textContent =
      "Översättning inte tillgänglig just nu. Visar originalfrågan.";
  }

  if (version !== quizVersion || questionIndex !== current) return;

  questionElement.textContent = translatedQuestion;

  const shuffled = shuffle(
    choices.map((choice, index) => ({
      original: choice,
      translated: translatedAnswers[index]
    }))
  );

  shuffled.forEach(choice => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = choice.translated;

    button.onclick = () => {
      const correct = choice.original === q.correct_answer;

      if (correct) points++;

      [...answers.children].forEach((b, index) => {
        b.disabled = true;

        if (shuffled[index].original === q.correct_answer) {
          b.classList.add("correct");
        } else if (b === button && !correct) {
          b.classList.add("wrong");
        }
      });

      document.getElementById("score").textContent =
        `Poäng: ${points}`;

      next.style.display = "block";

      next.textContent =
        current === questions.length - 1
          ? "Visa resultat"
          : "Nästa fråga →";
    };

    answers.appendChild(button);
  });
}

next.onclick = async () => {
  next.style.display = "none";
  current++;

  if (current < questions.length) {
    await showQuestion();
  } else {
    quiz.hidden = true;
    setup.hidden = false;

    status.textContent =
      `Quizet är klart! Du fick ${points} av ${questions.length} rätt.`;
  }
};
</script>
</body>
</html>
